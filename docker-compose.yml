
services:
  fraud-api:
    build:
      context: .
      dockerfile: FraudDetection.Api/Dockerfile
    container_name: fraud-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FraudDb: Host=postgres;Port=5432;Database=frauddb;Username=frauduser;Password=fraudpassword
      TransactionApi__BaseUrl: http://transaction-api:8080
    depends_on:
      - postgres
    networks:
      - default
      - shared-services

  postgres:
    image: postgres:16
    container_name: fraud-postgres
    environment:
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpassword
      POSTGRES_DB: frauddb
    ports:
      - "5432:5432"
    volumes:
      - fraud_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: fraud-keycloak
    command: start-dev
    ports:
      - "8082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloakpassword
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - default
      - shared-services

volumes:
  fraud_postgres_data:
  keycloak_data:

networks:
  shared-services:
    external: true
